<form method="post" action="/story/submit">
    <b>Submit the next word!</b>
    <input type="text" name="word"><br>
    <input type="radio" id="choice-nl" name="wordSpecial" value="(new line)">
    <label for="choice-nl">(new line)</label><br>
    <button><b>Submit</b></button>
    <p class="smalltext">
        Words must only use lowercase letters a-z and be 18 characters or less in length. You can end your word with a
        single dot, exclamation mark, or question mark.
    </p>
</form>
