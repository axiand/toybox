<details id="thread-%tid%" data-id="%tid%" open>
    <summary class="bbs-thread-title">#%tid%: <a href="/bbs/?read=%tid%">%title%</a> [ R:%replyCount% ]</summary>
    <div class="bbs-thread-body">
        <div class="bbs-op">%opPost%</div>
        <b>Replies (%replyCount%):</b>
        <ol class="bbs-replies" start="%offset%">%replies%</ol>
        %replyForm%
    </div>
</details>
